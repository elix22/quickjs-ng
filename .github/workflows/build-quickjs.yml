# Build prebuilt libqjs for the threejs-native-runtime SDK (phase12 P12.6).
#
# Builds THE PUSHED COMMIT of `tnr`, which is this fork's single project branch —
# everything the runtime uses lives there, and upstream `master` is merged into it
# periodically. Three variants per artifact: release (-O2, interpreter), debug (-O0),
# debug-dbg (-O0 + TNR_QJS_DEBUGGER = the DAP engine).
#
# THE PREBUILTS ARE INTERPRETER-ONLY, BY CONSTRUCTION. No AOT twins are ever baked in:
# twins are #included into quickjs.c's own TU at the *runtime's* build time, so an
# archive compiled once here can never carry them. AOT builds compile quickjs from
# source locally; these artifacts exist to serve the DEBUGGER and the cross-compiled
# SDK targets, which want a fetch instead of an 8s engine compile.
#
# Artifacts publish to a permanent GitHub RELEASE (tag prebuilt-<shortsha>); the
# runtime pins each asset's sha256 in libs.lock.json and fetches it into libs/qjs/.
#
# WAS: a separate scripts/prebuilt/PINNED_COMMIT named the commit to build, which made
# a THIRD record of "which quickjs this project uses" — alongside the parent repo's
# submodule pointer and libs.lock.json's tag — and the three could (and did) disagree.
# The branch head is now the only such record; the submodule pointer selects it.
name: Build QuickJS Libraries

on:
  workflow_dispatch:
  push:
    branches: [tnr]
    # Engine sources only: a docs/test-only push must not spend a 5-platform build.
    paths:
      - '**.c'
      - '**.h'
      - 'CMakeLists.txt'
      - 'scripts/prebuilt/**'
      - '.github/workflows/build-quickjs.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   os: macos-latest,   script: build-macos.sh,   asset: qjs-macos-universal.tar.gz }
          - { name: ios,     os: macos-latest,   script: build-ios.sh,     asset: qjs-ios-static.tar.gz }
          - { name: android, os: ubuntu-latest,  script: build-android.sh, asset: qjs-android.tar.gz }
          - { name: linux,   os: ubuntu-latest,  script: build-linux.sh,   asset: qjs-linux-x64.tar.gz }
          - { name: windows, os: windows-latest, script: build-windows.sh, asset: qjs-windows-x64.tar.gz }
    steps:
      # The commit being built IS the commit that triggered this run, so it is known
      # before any checkout — which lets the already-published probe below run first
      # and skip the clone entirely on a no-op re-run.
      - name: Identify the commit to build
        id: pin
        run: |
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:9}" >> "$GITHUB_OUTPUT"

      # Debug-loop economy: a pushed script tweak must not rebuild an artifact that is
      # already published and immutable — probe the release first and no-op the job.
      - name: Skip if this artifact is already published (immutable)
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prebuilt-${{ steps.pin.outputs.short }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "${{ matrix.asset }}"; then
            echo "${{ matrix.asset }} already published for $TAG — skipping the build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # One checkout, not two: it carries both the engine source AND the build scripts,
      # because they are now the same commit by construction.
      - name: Checkout QuickJS source + build scripts
        if: steps.published.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          path: qjs-src

      - name: Set up MSVC (windows only — cl/dumpbin on PATH for the build + checks)
        if: steps.published.outputs.skip != 'true' && matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        if: steps.published.outputs.skip != 'true'
        run: bash qjs-src/scripts/prebuilt/${{ matrix.script }} "$PWD/qjs-src" "$PWD/out"

      - name: Upload build artifact (90-day convenience copy)
        if: steps.published.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 90

      - name: Publish to release (permanent, immutable per asset)
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prebuilt-${{ steps.pin.outputs.short }}"
          # THE CREATE RACES FIVE WAYS, EVERY RUN. All five platform jobs finish within a
          # second or two of each other, all miss the `view`, and all call `create`; one
          # wins and the rest get HTTP 422. Losing that race is SUCCESS, not failure, so
          # fall back to re-checking existence — and only fail if the release still is not
          # there, which is a real error. (Latent before: under PINNED_COMMIT a new tag was
          # minted only on a deliberate pin bump, so five jobs rarely raced to create one.
          # The tag is now the pushed sha, so every push mints a new tag and always races.
          # It bit on the very first run: linux 422'd 1.5s after macos won.)
          #
          # --target pins the tag to THE COMMIT THAT WAS BUILT. Without it GitHub creates
          # the tag from the repository's DEFAULT BRANCH (master), so a tag named after a
          # `tnr` commit would point at an unrelated one. Ignored if the tag already exists.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "${{ steps.pin.outputs.sha }}" \
              --title "QuickJS prebuilt ($TAG)" \
              --notes "Prebuilt libqjs (release / debug / debug-dbg variants) built from \`tnr\` at ${{ steps.pin.outputs.sha }}. INTERPRETER-ONLY (no AOT twins - those compile into quickjs.c's TU at the runtime's build time). For threejs-native-runtime phase12 P12.6. Produced by build-quickjs.yml." \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          # First publish wins: the runtime pins each asset's sha256, so a re-upload
          # (new bytes) would break every clone that fetched the pin. Delete an asset
          # by hand only to deliberately republish, then re-pin the lock.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${{ matrix.asset }}"; then
            echo "${{ matrix.asset }} already published for $TAG — keeping the pinned bytes, skipping upload"
          else
            gh release upload "$TAG" "out/${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY"
          fi
